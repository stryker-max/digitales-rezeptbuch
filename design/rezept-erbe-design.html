#rezept-erbe-studio * { box-sizing:border-box; }
#rezept-erbe-studio .app { --bg:#0F172A;--panel:#1C2B40;--soft:#17253A;--line:#2A3F5A;--text:#E6EFF9;--muted:#9FB3CB;--blue:#8BB5FF;--accent:#4F80E2;--deep:#0A1624; color-scheme:dark; background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:24px;font:15px/1.55 'Manrope',system-ui,sans-serif; overflow:hidden; }
#rezept-erbe-studio button,#rezept-erbe-studio input,#rezept-erbe-studio select {font:inherit;}
#rezept-erbe-studio button {border:0;color:inherit;}
#rezept-erbe-studio button:disabled {opacity:.36;cursor:default;}
#rezept-erbe-studio button:not(:disabled),#rezept-erbe-studio summary {touch-action:manipulation;}
#rezept-erbe-studio button:focus-visible,#rezept-erbe-studio input:focus-visible,#rezept-erbe-studio select:focus-visible,#rezept-erbe-studio summary:focus-visible {outline:3px solid #B6D0FF;outline-offset:4px;}
#rezept-erbe-studio [hidden] {display:none!important;}
#rezept-erbe-studio h1,#rezept-erbe-studio h2,#rezept-erbe-studio h3,#rezept-erbe-studio p {margin:0;}
#rezept-erbe-studio h1 {font-size:32px;line-height:1.2;letter-spacing:-1.1px;font-weight:700;}
#rezept-erbe-studio h2 {font-size:23px;line-height:1.3;letter-spacing:-.55px;font-weight:700;}
#rezept-erbe-studio h3 {font-size:19px;line-height:1.35;font-weight:600;letter-spacing:-.3px;}
#rezept-erbe-studio .topbar {display:flex;gap:26px;align-items:center;justify-content:space-between;padding:22px 32px;background:var(--deep);border-bottom:1px solid var(--line);}
#rezept-erbe-studio .brand {display:flex;align-items:center;gap:11px;white-space:nowrap;}
#rezept-erbe-studio .brand-mark {display:grid;place-items:center;width:43px;height:43px;border:1px solid #4B6A99;border-radius:13px;color:#B3CEFF;background:#203557;}
#rezept-erbe-studio .brand-mark svg {width:23px;height:23px;}
#rezept-erbe-studio .brand-name {font-size:18px;line-height:1.2;font-weight:700;letter-spacing:-.5px;}
#rezept-erbe-studio .brand-name span {font-weight:400;color:#A8BEDB;}
#rezept-erbe-studio .topnav {display:flex;gap:5px;align-items:center;border-radius:15px;padding:4px;background:#15243A;}
#rezept-erbe-studio .topnav button {display:flex;gap:8px;align-items:center;justify-content:center;background:transparent;border-radius:11px;padding:12px 16px;min-height:48px;color:var(--muted);font-size:14px;font-weight:600;}
#rezept-erbe-studio .topnav button[aria-current="page"] {background:#2C456D;color:#E7F0FF;box-shadow:0 1px 4px #0004;}
#rezept-erbe-studio .nav-count {display:inline-grid;place-items:center;background:#3B5D91;min-width:20px;height:20px;border-radius:7px;font-size:11px;color:#F0F5FF;}
#rezept-erbe-studio .topnote {font-size:10px;letter-spacing:1.6px;color:#99AFCA;text-transform:uppercase;}
#rezept-erbe-studio main {padding:30px 32px 24px;min-width:0;}
#rezept-erbe-studio .eyebrow {display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;color:var(--blue);margin-bottom:9px;}
#rezept-erbe-studio .page-head {display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:24px;}
#rezept-erbe-studio .sub {color:var(--muted);font-size:14px;margin-top:8px;}
#rezept-erbe-studio .button {display:inline-flex;gap:10px;align-items:center;justify-content:center;min-height:52px;padding:13px 18px;border:1px solid #456083;border-radius:13px;background:#1A2C46;font-size:14px;font-weight:600;white-space:nowrap;}
#rezept-erbe-studio .button.primary {min-height:64px;background:#8BB5FF;color:#0A1624;border-color:#8BB5FF;box-shadow:0 6px 20px #497DE020;}
#rezept-erbe-studio .button.quiet {background:transparent;border-color:var(--line);}
#rezept-erbe-studio .button:hover:not(:disabled) {filter:brightness(1.12);}
#rezept-erbe-studio .hero {display:grid;grid-template-columns:1.05fr 1fr;border-radius:22px;background:#182A44;border:1px solid #2E4567;overflow:hidden;margin-bottom:26px;}
#rezept-erbe-studio .hero-copy {padding:31px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;}
#rezept-erbe-studio .hero h2 {font-size:36px;letter-spacing:-1.15px;line-height:1.16;margin:12px 0;}
#rezept-erbe-studio .hero-copy>p {color:#B4C5DC;max-width:29ch;font-size:15px;}
#rezept-erbe-studio .hero-meta {display:flex;gap:20px;flex-wrap:wrap;color:#C7D6EA;font-size:13px;margin:19px 0 24px;}
#rezept-erbe-studio .hero-meta span {display:flex;gap:7px;align-items:center;}
#rezept-erbe-studio .photo {background-image:var(--re-food);background-repeat:no-repeat;background-size:200% auto;background-color:#24334A;}
#rezept-erbe-studio .photo[data-food="0"] {background-position:0 0;}
#rezept-erbe-studio .photo[data-food="1"] {background-position:100% 0;}
#rezept-erbe-studio .photo[data-food="2"] {background-position:0 100%;}
#rezept-erbe-studio .photo[data-food="3"] {background-position:100% 100%;}
#rezept-erbe-studio .hero-photo {min-height:340px;position:relative;}
#rezept-erbe-studio .hero-photo:after {content:'';position:absolute;inset:0;background:linear-gradient(90deg,#182A4425,transparent 25%);pointer-events:none;}
#rezept-erbe-studio .photo-label {position:absolute;right:14px;bottom:14px;border:1px solid #FFFFFF2B;background:#0B1529E8;padding:7px 10px;border-radius:9px;font-size:10px;color:#D7E2EF;letter-spacing:.3px;}
#rezept-erbe-studio .library-tools {display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:22px;}
#rezept-erbe-studio .search {display:flex;align-items:center;gap:10px;flex:1;min-width:220px;min-height:54px;background:#142238;border:1px solid #3B5475;border-radius:13px;padding:0 16px;color:#B0C8E6;}
#rezept-erbe-studio .search input {background:transparent;border:0;width:100%;min-width:0;color:var(--text);font-size:15px;padding:15px 0;}
#rezept-erbe-studio input::placeholder {color:#92AAC6;opacity:1;}
#rezept-erbe-studio .filters {display:flex;gap:7px;flex-wrap:wrap;}
#rezept-erbe-studio .filter {min-height:48px;border-radius:12px;padding:9px 14px;background:transparent;border:1px solid #344C6C;color:#AFC4DF;font-size:13px;}

  let state={version:3,view:'library',recipe:0,step:0,source:false,query:'',filter:'Alle',targetDay:null,favorites:[0,3],plan:[{recipe:0,servings:4},{recipe:1,servings:2},{recipe:2,servings:2},null,null,null,null],adopted:false,bought:{},cookChecks:{}};
  let notice='';
  function restore(s){const p=s&&s.privateContent;if(!p||p.version!==3)return;const safeViews=['library','detail','plan','shopping','cook','import','review'];if(safeViews.includes(p.view))state.view=p.view;if(recipes[p.recipe])state.recipe=p.recipe;if(Number.isInteger(p.step))state.step=Math.max(0,Math.min(p.step,3+recipes[state.recipe].steps.length));if(Array.isArray(p.plan)&&p.plan.length===7)state.plan=p.plan.map(x=>x&&recipes[x.recipe]&&[1,2,4,6].includes(x.servings)?{recipe:x.recipe,servings:x.servings}:null);state.adopted=Boolean(p.adopted);state.favorites=Array.isArray(p.favorites)?p.favorites.filter(x=>recipes[x]):[0,3];state.bought=p.bought&&typeof p.bought==='object'?p.bought:{};state.cookChecks=p.cookChecks&&typeof p.cookChecks==='object'?p.cookChecks:{};}
  function save(){if(window.openai&&typeof window.openai.setWidgetState==='function')window.openai.setWidgetState({modelContent:{concept:'Digitales Rezeptbuch – Design v2',view:state.view,selectedRecipe:recipes[state.recipe].name,plannedDays:state.plan.filter(Boolean).length},privateContent:state}).catch(()=>{});}
  function icons(){if(globalThis.lucide)lucide.createIcons({attrs:{width:18,height:18,'stroke-width':1.7}});}
  function photo(id,cls){return '<div class="photo '+cls+'" data-food="'+id+'" role="img" aria-label="KI-Beispielbild: '+esc(recipes[id].name)+'"></div>';}
  function button(label,act,attrs='',primary=false){return '<button type="button" class="button '+(primary?'primary ':'')+'cursor-interaction" data-act="'+act+'" '+attrs+'>'+label+'</button>';}
  function quantities(){const map=new Map();state.plan.forEach((slot,day)=>{if(!slot)return;const r=recipes[slot.recipe];r.ingredients.forEach(i=>{const key=i.key+'|'+i.unit;const row=map.get(key)||{...i,key,qty:0,from:[]};row.qty+=i.qty*slot.servings/r.servings;row.from.push(days[day]);map.set(key,row);});});return [...map.values()];}
  function updateNav(){root.querySelectorAll('[data-act="nav"]').forEach(b=>{const active=b.dataset.view===state.view||(b.dataset.view==='library'&&['detail','cook','import','review'].includes(state.view));if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});root.querySelector('#re-shop-count').textContent=state.adopted?quantities().filter(i=>i.qty>(Number(state.bought[i.key])||0)).length:'0';}
  function status(){return '<p class="status" role="status">'+esc(notice)+'</p>';}
  function renderCards(){const grid=root.querySelector('#re-recipe-grid');if(!grid)return;const norm=s=>s.toLocaleLowerCase('de-AT').normalize('NFD').replace(/[\u0300-\u036f]/g,'');const q=norm(state.query);let rr=recipes.filter(r=>(state.filter==='Alle'||r.tags.includes(state.filter))&&norm(r.name+' '+r.tags.join(' ')+' '+r.ingredients.map(i=>i.name).join(' ')).includes(q));const filtered=state.query||state.filter!=='Alle'||state.targetDay!==null;root.querySelector('#re-hero').hidden=Boolean(filtered);if(!filtered)rr=rr.filter(r=>r.id!==0);root.querySelector('#re-list-title').textContent=state.targetDay!==null?'Rezept für '+days[state.targetDay]+' wählen':filtered?'Gefundene Rezepte':'Mehr aus deiner Sammlung';root.querySelector('#re-result-count').textContent=rr.length+' Rezepte';grid.innerHTML=rr.length?rr.map(r=>'<article class="recipe-card"><div class="photo" data-food="'+r.id+'"><button type="button" class="favorite cursor-interaction" data-act="favorite" data-id="'+r.id+'" aria-label="'+esc(r.name)+' als Favorit" aria-pressed="'+state.favorites.includes(r.id)+'">'+icon('heart')+'</button></div><div class="recipe-copy"><span class="tag">'+r.tag+'</span><h3>'+r.name+'</h3><div class="card-foot"><span class="small">'+r.time+' Min · '+r.servings+' Port.</span><button type="button" class="text-button cursor-interaction" data-act="'+(state.targetDay!==null?'pick':'detail')+'" data-id="'+r.id+'">'+(state.targetDay!==null?'Einplanen':'Ansehen')+icon('arrow-up-right')+'</button></div></div></article>').join(''):'<div class="empty"><h3>Kein passendes Rezept</h3><p class="sub">Versuche einen anderen Begriff oder Filter.</p></div>';icons();}
  function library(){main.innerHTML='<div class="page-head"><div><p class="eyebrow">Deine Sammlung</p><h1>'+(state.targetDay!==null?'Was gibt’s am '+days[state.targetDay]+'?':'Was kochen wir heute?')+'</h1><p class="sub">Deine Rezepte, gut sortiert und schnell gefunden.</p></div>'+button(icon('plus')+' Rezept hinzufügen','import','',true)+'</div><article id="re-hero" class="hero"><div class="hero-copy"><p class="eyebrow">'+icon('sparkles')+' Für einen gemütlichen Abend</p><h2>Kürbiscreme&shy;suppe</h2><p>Cremig, wärmend und genau richtig für einen kühlen Herbsttag.</p><div class="hero-meta"><span>'+icon('clock')+' 35 Minuten</span><span>'+icon('users')+' 4 Portionen</span></div>'+button('Rezept ansehen '+icon('arrow-right'),'detail','data-id="0"',true)+'</div><div class="photo hero-photo" data-food="0" role="img" aria-label="KI-Beispielbild: Kürbiscremesuppe"><span class="photo-label">Beispielbild</span></div></article><div class="library-tools"><label class="search">'+icon('search')+'<input id="re-search" aria-label="Rezepte durchsuchen" placeholder="Rezept, Zutat oder Stichwort …" value="'+esc(state.query)+'"></label><div class="filters" aria-label="Rezeptfilter">'+['Alle','Gemüse','Fleisch','Suppe','Dessert'].map(t=>'<button type="button" class="filter cursor-interaction" data-act="filter" data-tag="'+t+'" aria-pressed="'+(state.filter===t)+'">'+t+'</button>').join('')+'</div></div><div class="section-line"><h2 id="re-list-title"></h2><span id="re-result-count" class="small"></span></div><div id="re-recipe-grid" class="recipe-grid"></div>'+status();renderCards();}
  function detail(){const r=recipes[state.recipe];main.innerHTML='<button type="button" class="text-button back cursor-interaction" data-act="nav" data-view="library">'+icon('arrow-left')+' Zur Sammlung</button><div class="detail-grid"><div>'+photo(r.id,'detail-photo')+'<div class="muted-panel"><strong>Nährwerte</strong><p class="small">Für dieses Beispiel noch nicht berechnet.</p></div></div><div><span class="pill">'+r.tags.join(' · ')+'</span><h1 class="detail-title">'+r.name+'</h1><p class="sub">'+r.description+'</p><div class="facts"><div><span>Gesamtzeit · Beispiel</span><strong>'+r.time+' Min</strong></div><div><span>Rezeptmenge</span><strong>'+r.servings+' Portionen</strong></div><div><span>Zubereitung</span><strong>'+r.steps.length+' Schritte</strong></div></div><div class="actions">'+button(icon('cooking-pot')+' Rezept kochen','cook','',true)+button(icon('calendar-plus')+' Einplanen','add-plan')+'</div><h2 style="margin-top:27px">Zutaten</h2><ul class="ingredients">'+r.ingredients.map(i=>'<li><span>'+i.name+'</span><strong>'+fmt(i.qty)+' '+i.unit+'</strong></li>').join('')+'</ul></div></div>'+status();}
  function plan(){main.innerHTML='<div class="page-head"><div><p class="eyebrow">26. Oktober – 1. November</p><h1>Deine Woche. Dein Menü.</h1><p class="sub">Gerichte auswählen – der Einkauf ergibt sich daraus.</p></div>'+button(icon('sparkles')+' Vorschlag füllen','suggest')+'</div><div class="week-grid">'+days.map((d,n)=>{const s=state.plan[n],r=s?recipes[s.recipe]:null;return '<article class="day-card"><div class="day-head"><h3>'+d+'</h3><span class="day-date">'+(n<6?26+n+'. Okt.':'1. Nov.')+'</span></div>'+(r?'<div class="day-recipe">'+photo(r.id,'thumb')+'<div><span class="tag">'+r.tag+'</span><h3>'+r.name+'</h3><span class="small">'+r.time+' Minuten · Beispiel</span></div></div><div class="day-actions"><label class="small">Portionen <select class="select" data-servings="'+n+'" aria-label="Portionen am '+d+'">'+[1,2,4,6].map(x=>'<option value="'+x+'" '+(x===s.servings?'selected':'')+'>'+x+'</option>').join('')+'</select></label><div class="actions"><button type="button" class="icon-button cursor-interaction" data-act="choose-day" data-day="'+n+'" aria-label="Gericht am '+d+' austauschen">'+icon('arrow-left-right')+'</button><button type="button" class="icon-button cursor-interaction" data-act="remove-day" data-day="'+n+'" aria-label="Gericht am '+d+' entfernen">'+icon('x')+'</button></div></div>':'<button type="button" class="empty-day cursor-interaction" data-act="choose-day" data-day="'+n+'">'+icon('plus')+' Rezept auswählen</button>')+'</article>';}).join('')+'</div><div class="plan-summary"><div><h3>'+state.plan.filter(Boolean).length+' Tage geplant</h3><p class="sub">'+(state.adopted?'Deine Einkaufsliste wird bei Änderungen mitgeführt.':'Beim Übernehmen entsteht automatisch deine Einkaufsliste.')+'</p></div>'+button(icon('shopping-basket')+' '+(state.adopted?'Zum Einkauf':'Plan übernehmen'),'adopt',state.plan.some(Boolean)?'':'disabled',true)+'</div>'+status();}
  function shopping(){if(!state.adopted){main.innerHTML='<div class="page-head"><div><p class="eyebrow">Alles auf einer Liste</p><h1>Dein Einkauf</h1></div></div><div class="empty">'+icon('shopping-basket')+'<h2>Erst das Menü, dann der Einkauf.</h2><p class="sub">Übernimm deinen Wochenplan. Die Zutaten werden automatisch zusammengerechnet.</p>'+button('Zum Wochenplan '+icon('arrow-right'),'nav','data-view="plan"',true)+'</div>';return;}const rows=quantities(),groups=[...new Set(rows.map(i=>i.group))],open=rows.filter(i=>i.qty>(Number(state.bought[i.key])||0));main.innerHTML='<div class="page-head"><div><p class="eyebrow">Aus deinem Wochenplan</p><h1>Einmal einkaufen. Gut vorbereitet.</h1><p class="sub">Gleiche Zutaten sind bereits zusammengefasst.</p></div></div><div class="shopping-layout"><div>'+groups.map(g=>'<section class="shopping-group"><h2 class="group-title">'+icon(g==='Gemüse & Obst'?'carrot':g==='Kühlregal'?'milk':'shopping-basket')+g+'</h2>'+rows.filter(i=>i.group===g).map(i=>{const bought=Number(state.bought[i.key])||0,left=Math.max(0,i.qty-bought),done=left===0;return '<label class="shop-row cursor-interaction '+(done?'done':'')+'"><input type="checkbox" data-buy="'+i.key+'" '+(done?'checked':'')+'><span><strong>'+i.name+'</strong><small>'+[...new Set(i.from)].join(' · ')+(bought&&!done?' · '+fmt(bought)+' '+i.unit+' gekauft':'')+'</small></span><strong>'+fmt(done?i.qty:left)+' '+i.unit+'</strong></label>';}).join('')+'</section>').join('')+'</div><aside class="shopping-side"><p class="eyebrow">Deine Liste</p><h2>'+open.length+' Positionen offen</h2><p class="sub">Für '+state.plan.filter(Boolean).length+' geplante Tage. Änderungen am Menü werden hier berücksichtigt.</p>'+button('Menü bearbeiten '+icon('arrow-up-right'),'nav','data-view="plan"')+'</aside></div>'+status();}
  function check(key,label,note='',quantity=''){return '<label class="check-row cursor-interaction"><input type="checkbox" data-check="'+key+'" '+(state.cookChecks[key]?'checked':'')+'><span>'+label+(note?'<small>'+note+'</small>':'')+'</span>'+(quantity?'<strong>'+quantity+'</strong>':'')+'</label>';}
  function sourceText(r){return r.name+'\n'+r.servings+' Portionen\n\n'+r.ingredients.map(i=>fmt(i.qty)+' '+i.unit+' '+i.name).join(', ')+'\n\n'+r.steps.map(s=>s[1]).join('\n\n');}
  function cook(){const r=recipes[state.recipe],last=3+r.steps.length;state.step=Math.min(state.step,last);const panels=[
    '<span class="step-number">Vorbereitung</span><h2>Alles griffbereit.</h2>'+r.equipment.map((x,i)=>check('e'+r.id+'-'+i,x[0],x[1])).join(''),
    '<span class="step-number">Vorbereitung</span><h2>Zutaten bereitlegen.</h2>'+r.ingredients.map(i=>check('i'+r.id+'-'+i.key,i.name,'',fmt(i.qty)+' '+i.unit)).join(''),
    '<span class="step-number">Vorbereitung</span><h2>Bereit zum Loskochen?</h2><p class="instruction">'+r.description+'</p><div class="facts"><div><span>Gesamtzeit · Beispiel</span><strong>'+r.time+' Min</strong></div><div><span>Portionen</span><strong>'+r.servings+'</strong></div><div><span>Schritte</span><strong>'+r.steps.length+'</strong></div></div>',
    ...r.steps.map((s,i)=>'<span class="step-number">Schritt '+(i+1)+' von '+r.steps.length+'</span><h2>'+s[0]+'</h2><p class="instruction">'+s[1]+'</p>'+(s[2].length?'<div class="step-ingredients">'+s[2].map(x=>'<span class="pill">'+x+'</span>').join('')+'</div>':'')),
    '<span class="finish-symbol">'+icon('check')+'</span><h2>Fertig gekocht.</h2><p>Guten Appetit!</p>'+button('Zur Sammlung '+icon('arrow-right'),'nav','data-view="library"',true),
    '<span class="step-number">Beispielvorlage</span><h2>Zum Nachlesen.</h2><p class="source-copy">'+esc(sourceText(r))+'</p>'
  ];main.innerHTML='<div class="cook-header">'+photo(r.id,'thumb')+'<div><p class="eyebrow">Kochmodus</p><h1>'+r.name+'</h1></div></div><nav class="cook-nav" aria-label="Kochschritte"><button type="button" id="re-cook-prev" class="button cursor-interaction" data-act="prev">'+icon('arrow-left')+' Zurück</button><div id="re-cook-counter" class="cook-counter" aria-live="polite"></div><button type="button" id="re-cook-next" class="button primary cursor-interaction" data-act="next">Weiter '+icon('arrow-right')+'</button></nav><div class="cook-stack">'+panels.map((p,i)=>'<section class="cook-panel '+(i===last?'finish':'')+'" data-panel="'+i+'" aria-hidden="true" inert>'+p+'</section>').join('')+'</div><div class="cook-bottom"><div class="step-track" aria-hidden="true">'+Array.from({length:last+1},(_,i)=>'<span data-track="'+i+'"></span>').join('')+'</div><button type="button" class="text-button cursor-interaction" data-act="source" id="re-source-toggle">'+icon('file-text')+' Beispielvorlage</button></div>';updateCook();}
  function updateCook(){const r=recipes[state.recipe],last=3+r.steps.length,active=state.source?last+1:state.step;root.querySelectorAll('[data-panel]').forEach(p=>{const on=Number(p.dataset.panel)===active;p.classList.toggle('is-active',on);p.setAttribute('aria-hidden',String(!on));if(on)p.removeAttribute('inert');else p.setAttribute('inert','');});root.querySelector('#re-cook-prev').disabled=state.step===0;root.querySelector('#re-cook-next').disabled=state.step===last;root.querySelector('#re-cook-counter').innerHTML=state.step<3?'Vorbereitung<strong>'+(state.step+1)+' / 3</strong>':state.step===last?'Fertig<strong>'+r.steps.length+' / '+r.steps.length+'</strong>':'Schritt<strong>'+(state.step-2)+' / '+r.steps.length+'</strong>';root.querySelectorAll('[data-track]').forEach(t=>t.classList.toggle('on',Number(t.dataset.track)<=state.step));root.querySelector('#re-source-toggle').innerHTML=icon(state.source?'arrow-left':'file-text')+(state.source?' Zur Anleitung':' Beispielvorlage');icons();}
  function importView(){main.innerHTML='<div class="page-head"><div><p class="eyebrow">Aus Papier wird ein Rezept</p><h1>Ein neues Rezept.</h1><p class="sub">Fotografieren, auswählen oder ein PDF verwenden.</p></div></div><div class="upload-zone">'+icon('scan-line')+'<h2 style="margin-top:14px">Dein Rezept beginnt hier.</h2><p class="sub">Ein Foto, mehrere Seiten oder eine PDF-Datei.</p><div class="actions">'+button(icon('camera')+' Foto aufnehmen','camera')+button(icon('upload')+' Datei auswählen','file')+'</div><input hidden type="file" id="re-file" accept="image/*,application/pdf"><input hidden type="file" id="re-camera" accept="image/*" capture="environment"><p id="re-file-status" class="status" role="status">Im Designentwurf werden keine Dateien hochgeladen.</p></div><div class="muted-panel"><strong>Die Prüfung ansehen</strong><p class="small">Ein künstliches Beispiel zeigt die Gegenüberstellung.</p><div class="actions" style="margin-top:14px">'+button('Beispiel öffnen '+icon('arrow-right'),'review')+'</div></div>';}
  function review(){const r=recipes[0];main.innerHTML='<div class="page-head"><div><p class="eyebrow">Beispielprüfung</p><h1>Alles richtig übernommen?</h1><p class="sub">Vorlage und aufbereitete Fassung im direkten Vergleich.</p></div></div><div class="import-grid"><div class="paper"><small>ERFUNDENE VORLAGE · KEIN HOCHGELADENES ORIGINAL</small>'+esc(sourceText(r))+'</div><div><span class="pill">Beispiel · Zutaten und Schritte</span><h2 style="margin-top:18px">'+r.name+'</h2><ul class="ingredients">'+r.ingredients.map(i=>'<li><span>'+i.name+'</span><strong>'+fmt(i.qty)+' '+i.unit+'</strong></li>').join('')+'</ul>'+button('Zur Rezeptansicht '+icon('arrow-right'),'detail','data-id="0"',true)+'</div></div>';}
  function render(){updateNav();({library,detail,plan,shopping,cook,import:importView,review}[state.view]||library)();icons();}
  function planChanged(){if(state.adopted)notice='Plan und Einkaufsliste aktualisiert.';updateNav();}
  root.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const a=b.dataset.act;notice='';
    if(a==='next'||a==='prev'){const last=3+recipes[state.recipe].steps.length;state.step=Math.max(0,Math.min(last,state.step+(a==='next'?1:-1)));state.source=false;updateCook();save();return;}
    if(a==='source'){state.source=!state.source;updateCook();save();return;}
    if(a==='nav'){state.view=b.dataset.view;state.targetDay=null;}
    else if(a==='detail'){state.recipe=Number(b.dataset.id);state.view='detail';}
    else if(a==='filter'){state.filter=b.dataset.tag;root.querySelectorAll('[data-act="filter"]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.tag===state.filter)));renderCards();save();return;}
    else if(a==='favorite'){const id=Number(b.dataset.id);state.favorites=state.favorites.includes(id)?state.favorites.filter(x=>x!==id):[...state.favorites,id];b.setAttribute('aria-pressed',String(state.favorites.includes(id)));save();return;}
    else if(a==='cook'){state.view='cook';state.step=0;state.source=false;}
    else if(a==='choose-day'){state.targetDay=Number(b.dataset.day);state.view='library';state.query='';state.filter='Alle';}
    else if(a==='pick'){const id=Number(b.dataset.id);state.plan[state.targetDay]={recipe:id,servings:recipes[id].servings};state.targetDay=null;state.view='plan';planChanged();}
    else if(a==='remove-day'){state.plan[Number(b.dataset.day)]=null;planChanged();}
    else if(a==='add-plan'){const n=state.plan.findIndex(x=>!x);if(n>=0){state.plan[n]={recipe:state.recipe,servings:recipes[state.recipe].servings};notice='Für '+days[n]+' eingeplant.';planChanged();}else notice='Alle Tage sind belegt. Wähle einen Tag zum Austauschen.';state.view='plan';}
    else if(a==='suggest'){const ids=[0,1,2,0,3,1,2];state.plan=state.plan.map((s,i)=>s||{recipe:ids[i],servings:recipes[ids[i]].servings});notice='Freie Tage mit Beispielgerichten gefüllt.';planChanged();}
    else if(a==='adopt'){state.adopted=true;state.view='shopping';}
    else if(a==='import'){state.view='import';}
    else if(a==='review'){state.view='review';}
    else if(a==='camera'||a==='file'){root.querySelector(a==='camera'?'#re-camera':'#re-file').click();return;}
    render();save();
  });
  root.addEventListener('input',e=>{if(e.target.id==='re-search'){state.query=e.target.value;renderCards();}});
  root.addEventListener('change',e=>{const t=e.target;if(t.dataset.servings!==undefined){state.plan[Number(t.dataset.servings)].servings=Number(t.value);planChanged();render();save();}else if(t.dataset.buy){const i=quantities().find(x=>x.key===t.dataset.buy);if(i)state.bought[i.key]=t.checked?i.qty:0;render();save();}else if(t.dataset.check){state.cookChecks[t.dataset.check]=t.checked;save();}else if(t.id==='re-file'||t.id==='re-camera'){const f=t.files&&t.files[0];root.querySelector('#re-file-status').textContent=f?'Ausgewählt: '+f.name+' · in diesem Entwurf nicht analysiert.':'Keine Datei ausgewählt.';}});
  window.addEventListener('openai:set_globals',e=>{if(e.detail&&e.detail.globals&&e.detail.globals.widgetState){restore(e.detail.globals.widgetState);render();}});
  restore(window.openai&&window.openai.widgetState);render();
  if(globalThis.Tweak){const design={cookSize:29};const tweak=new Tweak({container:root.querySelector('.app'),onChange:()=>root.querySelector('.app').style.setProperty('--cook-size',design.cookSize+'px')});tweak.addSlider(design,'cookSize',{label:'Schrift im Kochmodus',min:26,max:36,step:1,unit:'px'});}
})();
</script>
</div>
